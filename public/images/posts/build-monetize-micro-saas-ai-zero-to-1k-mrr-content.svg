<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_MONETIZATION" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Solid Gradient Background -->
  <rect width="1200" height="675" fill="url(#bgGrad_MONETIZATION)" />

  <!-- Geometric Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.1" stroke-width="2">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="200" y1="0" x2="200" y2="675" />
    <line x1="400" y1="0" x2="400" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="800" y1="0" x2="800" y2="675" />
    <line x1="1000" y1="0" x2="1000" y2="675" />
  </g>

  <!-- Glass Card Frame -->
  <rect x="70" y="70" width="1060" height="535" rx="36" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />

  <!-- Emoji Icon Badge -->
  <circle cx="160" cy="170" r="40" fill="#ffffff" fill-opacity="0.95" />
  <text x="160" y="182" font-family="system-ui, sans-serif" font-size="36" text-anchor="middle">💰</text>

  <!-- Category Tag -->
  <rect x="220" y="146" width="220" height="48" rx="24" fill="#ffffff" fill-opacity="0.95" />
  <text x="330" y="176" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#059669" text-anchor="middle" letter-spacing="1.5">MONETIZATION ✓</text>

  <!-- Title Text -->
  <text x="130" y="290" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff">Micro-SaaS Zero to $1k MRR - Benchmark</text>
  <text x="130" y="350" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9" letter-spacing="1">BENCHMARK DATA & ARCHITECTURE</text>

  <!-- Brand Watermark -->
  <rect x="900" y="500" width="180" height="44" rx="22" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.4" />
  <text x="990" y="529" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">playzy.me</text>
